name: Deploy to Vercel (development)

# Deploying the development environment used to happen automatically for every
# push to `beta` and every push to a PR targeting it. Each of those builds a
# fresh set of Vercel Functions that Vercel then retains, and the total size of
# all retained bundles is what "Function Storage" bills for — so an active PR
# could burn through the quota on its own (issue #50).
#
# It is a manual button instead: Actions → Deploy to Vercel (development) →
# Run workflow. Pick the branch (or tag, or commit) to put on the dev domain.
# Nothing deploys until someone asks for it, which is the point.
#
# Production is unaffected — that still deploys automatically from `main` via
# the `deploy` job in ci.yaml.
#
# The domain is dev-commissioner-suite.vercel.app unless the repository
# variable DEV_DOMAIN says otherwise (Settings → Secrets and variables →
# Actions → Variables) — moving the dev environment to a different host is then
# a settings change rather than a commit. Whichever it resolves to must already
# be attached to the Vercel project: `vercel alias set` assigns a domain the
# account owns, it does not register a new one.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy'
        type: string
        required: false
        default: 'beta'

jobs:
  deploy-dev:
    name: Deploy to Vercel (development)
    runs-on: ubuntu-latest
    # One domain means one deploy at a time, and the newest request is the one
    # that should end up holding it — an older build finishing late must not
    # claim it back.
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    env:
      DEV_DOMAIN: ${{ vars.DEV_DOMAIN || 'dev-commissioner-suite.vercel.app' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The variable goes through the environment rather than being pasted into
      # the script — an expression expands before the shell parses the line, so
      # a stray quote in a setting would otherwise rewrite the command.
      - name: Report the development domain
        run: |
          echo "Deploying $DEPLOY_REF to https://$DEV_DOMAIN"
          if [ -z "$DEV_DOMAIN_VAR" ]; then
            echo "(the built-in default — set the DEV_DOMAIN variable to override)"
          else
            echo "(from the DEV_DOMAIN repository variable)"
          fi
        env:
          DEV_DOMAIN_VAR: ${{ vars.DEV_DOMAIN }}
          DEPLOY_REF: ${{ inputs.ref }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # A preview build rather than --prod: production belongs to the deploy job
      # in ci.yaml. Preview builds read the Preview environment's variables in
      # the Vercel project, which is where the dev database and NEXTAUTH_URL
      # live.
      - name: Build a preview deployment
        id: deploy
        run: |
          # The CLI puts progress on stderr and the deployment URL on stdout,
          # but takes the last line rather than the whole of it: a notice about
          # a newer CLI version arriving on stdout would otherwise be spliced
          # into the URL handed to `alias set` below.
          url=$(vercel deploy --yes --token="$VERCEL_TOKEN" | tail -n 1)

          case "$url" in
            https://*)
              ;;
            *)
              echo "::error::Expected a deployment URL from vercel deploy, got: ${url:-nothing}"
              exit 1
              ;;
          esac

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Built $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Point the development domain at this build
        run: vercel alias set "$DEPLOYMENT_URL" "$DEV_DOMAIN" --token="$VERCEL_TOKEN"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Summarise the deployment
        if: always()
        run: |
          {
            echo "## Development Deployment"
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| Domain | https://$DEV_DOMAIN |"
            echo "| Build | ${DEPLOYMENT_URL:-not built} |"
            echo "| Ref | ${DEPLOY_REF} |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Requested by | @${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_REF: ${{ inputs.ref }}
