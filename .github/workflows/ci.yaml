name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── 1. Code Count ──────────────────────────────────────────────────────────
  code-count:
    name: Code Count
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get install -y cloc

      - name: Count lines of code
        run: |
          echo "## Code Count Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cloc \
            --exclude-dir=node_modules,.next,coverage,dist \
            --include-lang=TypeScript,JavaScript,JSON,CSS \
            --quiet \
            . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Count test coverage (files)
        run: |
          SRC=$(find src -name "*.ts" -o -name "*.tsx" | grep -v "\.d\.ts" | wc -l)
          TESTS=$(find tests -name "*.test.ts" -o -name "*.test.tsx" 2>/dev/null | wc -l)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source files | $SRC |" >> $GITHUB_STEP_SUMMARY
          echo "| Test files | $TESTS |" >> $GITHUB_STEP_SUMMARY

  # ── 2. Project Check ───────────────────────────────────────────────────────
  project-check:
    name: Project Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./test.db

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --max-warnings=0

  # ── 3. Dependency Check ────────────────────────────────────────────────────
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm audit` exits 1 both for real advisories and for a registry endpoint
      # failure, so a bare `npm audit --audit-level=high` turns an npmjs.org
      # outage into a red build with a misleading message ("Invalid package
      # tree, run npm install to rebuild your package-lock.json" — the lockfile
      # is fine; `npm ci` above would have failed first if it weren't).
      #
      # Tell the two apart by the shape of --json output: a real report carries
      # .metadata.vulnerabilities, whereas an endpoint error carries
      # .statusCode/.message instead (npm/lib/utils/audit-error.js). A genuine
      # advisory still fails the build; an unreachable endpoint only warns.
      - name: npm audit (high and critical only)
        run: |
          for attempt in 1 2; do
            # Each attempt is capped: npm retries the retired "quick" endpoint
            # after the bulk one fails, which can hang for many minutes.
            report=$(timeout 300 npm audit --json || true)

            if printf '%s' "$report" | jq -e 'has("metadata")' >/dev/null 2>&1; then
              found=$(printf '%s' "$report" \
                | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical')

              if [ "$found" -gt 0 ]; then
                echo "::error::npm audit found $found high/critical advisories"
                printf '%s' "$report" | jq -r '
                  .vulnerabilities | to_entries[]
                  | select(.value.severity == "high" or .value.severity == "critical")
                  | "  \(.value.severity)\t\(.key)"'
                exit 1
              fi

              echo "No high or critical advisories."
              exit 0
            fi

            # jq emits nothing at all for empty input, so the fallback for a
            # killed/hung npm lives in the parameter expansion, not in the filter.
            reason=$(printf '%s' "$report" \
              | jq -r '.statusCode // .message // empty' 2>/dev/null || true)
            echo "Audit endpoint returned no report (attempt $attempt/2): ${reason:-no response}"

            if [ "$attempt" -lt 2 ]; then
              sleep 30
            fi
          done

          echo "::warning::npm audit endpoint unreachable — dependency audit skipped for this run."

      - name: Check for outdated packages
        run: |
          echo "## Outdated Packages" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm outdated || true >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # ── 4. SAST — Semgrep ──────────────────────────────────────────────────────
  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    # Skip on dependabot PRs — it doesn't have access to secrets
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config auto \
            --config p/typescript \
            --config p/nextjs \
            --config p/secrets \
            --sarif-output=semgrep.sarif \
            --json-output=semgrep.json \
            --quiet || true
        env:
          # Optional: set SEMGREP_APP_TOKEN in repo secrets to use Semgrep Cloud
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep JSON report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep.json
          retention-days: 30

      - name: Summarise findings
        if: always()
        run: |
          echo "## Semgrep SAST Results" >> $GITHUB_STEP_SUMMARY
          if [ -f semgrep.json ]; then
            FINDINGS=$(python3 -c "
          import json, sys
          data = json.load(open('semgrep.json'))
          results = data.get('results', [])
          errors  = data.get('errors',  [])
          print(f'| Findings | {len(results)} |')
          print(f'| Errors   | {len(errors)}  |')
          sevs = {}
          for r in results:
              s = r.get('extra', {}).get('severity', 'UNKNOWN')
              sevs[s] = sevs.get(s, 0) + 1
          for s, c in sorted(sevs.items()):
              print(f'| {s} | {c} |')
          ")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "$FINDINGS" >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file found." >> $GITHUB_STEP_SUMMARY
          fi

  # ── 5. Unit Tests ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Only run tests after project checks and security scan pass
    needs: [project-check, semgrep-sast]
    defaults:
      run:
        working-directory: nextjs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./test.db

      - name: Run tests
        run: npx jest --coverage --ci
        env:
          PYTHON_API_URL: http://localhost:8000
          NFL_SEASON: "2025"
          ADMIN_USERNAME: admin
          SCHEDULE_MAX_ATTEMPTS: "100"
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: file:./test.db

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: nextjs/coverage/
          retention-days: 14

  # ── 6. Deploy to Vercel — production ───────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [code-count, project-check, dependency-check, semgrep-sast, test]
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 7. Deploy to Vercel — development ──────────────────────────────────────
  #
  # Everything landing on the beta branch, and every push to a PR that targets
  # it, is built as a Vercel preview and the development domain is then pointed
  # at that build. One shared URL, last build wins — so an open PR takes the
  # domain from the branch until the branch (or another PR) builds again.
  #
  # The domain is dev-commissioner-suite.vercel.app unless the repository
  # variable DEV_DOMAIN says otherwise (Settings → Secrets and variables →
  # Actions → Variables) — moving the dev environment to a different host is
  # then a settings change rather than a commit. Whichever it resolves to must
  # already be attached to the Vercel project: `vercel alias set` assigns a
  # domain the account owns, it does not register a new one.
  deploy-dev:
    name: Deploy to Vercel (development)
    runs-on: ubuntu-latest
    needs: [code-count, project-check, dependency-check, semgrep-sast, test]
    # A fork's PR has no access to the repository's secrets, so the deploy could
    # only fail — the checks above still run on it, this does not.
    if: >-
      success()
      && ((github.event_name == 'push' && github.ref == 'refs/heads/1.0.0-beta.01')
      || (github.event_name == 'pull_request' && github.base_ref == '1.0.0-beta.01'
      && github.event.pull_request.head.repo.full_name == github.repository))
    # One domain means one deploy at a time, and the newest push is the one that
    # should end up holding it — an older build finishing late must not claim it
    # back.
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    env:
      DEV_DOMAIN: ${{ vars.DEV_DOMAIN || 'dev-commissioner-suite.vercel.app' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The variable goes through the environment rather than being pasted into
      # the script — an expression expands before the shell parses the line, so
      # a stray quote in a setting would otherwise rewrite the command.
      - name: Report the development domain
        run: |
          echo "Deploying to https://$DEV_DOMAIN"
          if [ -z "$DEV_DOMAIN_VAR" ]; then
            echo "(the built-in default — set the DEV_DOMAIN variable to override)"
          else
            echo "(from the DEV_DOMAIN repository variable)"
          fi
        env:
          DEV_DOMAIN_VAR: ${{ vars.DEV_DOMAIN }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # A preview build rather than --prod: production belongs to the deploy job
      # above. Preview builds read the Preview environment's variables in the
      # Vercel project, which is where the dev database and NEXTAUTH_URL live.
      - name: Build a preview deployment
        id: deploy
        run: |
          # The CLI puts progress on stderr and the deployment URL on stdout,
          # but takes the last line rather than the whole of it: a notice about
          # a newer CLI version arriving on stdout would otherwise be spliced
          # into the URL handed to `alias set` below.
          url=$(vercel deploy --yes --token="$VERCEL_TOKEN" | tail -n 1)

          case "$url" in
            https://*)
              ;;
            *)
              echo "::error::Expected a deployment URL from vercel deploy, got: ${url:-nothing}"
              exit 1
              ;;
          esac

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Built $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Point the development domain at this build
        run: vercel alias set "$DEPLOYMENT_URL" "$DEV_DOMAIN" --token="$VERCEL_TOKEN"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Summarise the deployment
        if: always()
        run: |
          {
            echo "## Development Deployment"
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| Domain | https://$DEV_DOMAIN |"
            echo "| Build | ${DEPLOYMENT_URL:-not built} |"
            echo "| Source | ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || '1.0.0-beta.01' }} |"
            echo "| Commit | ${{ github.event.pull_request.head.sha || github.sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}