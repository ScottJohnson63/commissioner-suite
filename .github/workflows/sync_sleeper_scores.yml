name: Sync Sleeper Scores

on:
  schedule:
    - cron: '30 8 * * 2'  # Every Tuesday at 08:30 UTC — 30 min after NFL stats sync
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync regardless of season window'
        required: false
        default: 'false'
      week:
        description: 'Override week number (leave blank for auto)'
        required: false
        default: ''
      league_id:
        description: 'Sleeper league ID to sync (leave blank for every league)'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd python
          pip install -r requirements.txt

      - name: Run Sleeper score sync
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NFL_SEASON: "2025"
          FORCE: ${{ github.event.inputs.force || 'false' }}
          WEEK: ${{ github.event.inputs.week || '' }}
          LEAGUE_ID: ${{ github.event.inputs.league_id || '' }}
        run: |
          cd python
          python scripts/sync_sleeper_scores.py